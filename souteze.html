<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDH Bor u Sedlčan — Soutěže</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0A121D;
    --navy-800:#0F1B29;
    --navy-700:#152638;
    --ochre-500:#D98A2B;
    --ochre-400:#E7A652;
    --ivory:#F3EEE2;
    --ivory-dim:#B9C0C9;
    --line:rgba(217,138,43,0.35);
  }
  body{margin:0;background:var(--ivory);font-family:'Inter',system-ui,sans-serif;color:var(--navy-900);}
  h1,h2,h3{font-family:'Oswald',system-ui,sans-serif;letter-spacing:0.01em;margin:0;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  a{color:inherit;text-decoration:none;}
  .navlink{color:var(--ivory-dim);font-size:14px;font-weight:500;letter-spacing:0.02em;}
  .navlink:hover{color:var(--ochre-400);}
  .plate{background:var(--navy-800);border:1px solid var(--line);}
  .card{background:#FFFFFF;border:1px solid #E4DCC9;}
  .section-label{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.14em;color:var(--ochre-500);text-transform:uppercase;}
  .chip{font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px 16px;border-radius:999px;border:1px solid #DCD3BC;color:#5A5140;background:transparent;cursor:pointer;}
  .chip.active{background:var(--navy-900);color:var(--ochre-400);border-color:var(--navy-900);}
  .win-tag{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.05em;color:var(--navy-900);background:var(--ochre-500);padding:4px 10px;border-radius:2px;white-space:nowrap;}
  .result-row{border-radius:2px;padding:20px 24px;display:flex;align-items:center;gap:20px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4, minmax(0,1fr));}
  .badge-win{width:78px;flex-shrink:0;}
  .year-col{width:88px;flex-shrink:0;}
  .time-col{flex-shrink:0;}
  .result-content{flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  @media (max-width:640px){
    .stat-grid{grid-template-columns:repeat(2, minmax(0,1fr));}
    .result-row{flex-wrap:wrap;row-gap:8px;column-gap:12px;}
    .badge-win{width:auto;order:1;}
    .year-col{width:auto;order:2;}
    .time-col{order:3;margin-left:auto;}
    .result-content{order:4;flex-basis:100%;}
  }
</style>
</head>
<body>

<div style="width:100%;min-height:100vh;background:var(--ivory);display:flex;flex-direction:column;">

  <!-- Utility bar -->
  <div style="width:100%;background:var(--navy-900);">
    <div style="max-width:1280px;margin:0 auto;padding:8px 32px;display:flex;justify-content:space-between;align-items:center;">
      <div class="mono" style="color:var(--ivory-dim);font-size:12px;">Bor 3, Nedrahovice 264 01</div>
      <a href="mailto:sdh.bor.nedrahovice@gmail.com" class="mono" style="color:var(--ivory-dim);font-size:12px;">sdh.bor.nedrahovice@gmail.com</a>
    </div>
  </div>

  <!-- Header (shared) -->
  <header style="width:100%;background:var(--navy-900);border-bottom:1px solid var(--line);">
    <div style="max-width:1280px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;">
      <a href="index.html" style="display:flex;flex-direction:column;line-height:1.15;">
        <span style="color:var(--ochre-400);font-family:'Oswald';font-weight:600;font-size:22px;letter-spacing:0.02em;">SDH BOR</span>
        <span class="mono" style="color:var(--ivory-dim);font-size:12px;">U SEDLČAN</span>
      </a>
      <nav style="display:flex;gap:28px;align-items:center;">
        <a href="index.html" class="navlink">Úvod</a>
        <a href="historie.html" class="navlink">Historie</a>
        <a href="clenove.html" class="navlink">Seznam členů</a>
        <a href="#" class="navlink" style="color:var(--ochre-400);">Soutěže</a>
        <a href="akce.html" class="navlink">Akce</a>
        <a href="index.html#kontakt" class="navlink">Kontakt</a>
      </nav>
    </div>
  </header>

  <!-- Page header -->
  <section style="width:100%;background:var(--navy-900);">
    <div style="max-width:1280px;margin:0 auto;padding:64px 32px 48px;display:flex;flex-direction:column;gap:16px;">
      <div class="section-label">Soutěže</div>
      <h1 style="color:var(--ivory);font-size:40px;font-weight:700;">Výsledky z požárního sportu 2006–2019</h1>
    </div>
  </section>

  <!-- Stat plates -->
  <section style="width:100%;background:var(--navy-800);border-bottom:1px solid var(--line);">
    <div style="max-width:1280px;margin:0 auto;padding:0 32px;" class="stat-grid">
      <div style="padding:26px 24px;border-right:1px solid var(--line);text-align:center;">
        <div class="mono" style="color:var(--ochre-400);font-size:26px;font-weight:600;">18+</div>
        <div style="color:var(--ivory-dim);font-size:13px;margin-top:4px;">Vítězství</div>
      </div>
      <div style="padding:26px 24px;border-right:1px solid var(--line);text-align:center;">
        <div class="mono" style="color:var(--ochre-400);font-size:26px;font-weight:600;">3</div>
        <div style="color:var(--ivory-dim);font-size:13px;margin-top:4px;">Soutěžní týmy</div>
      </div>
      <div style="padding:26px 24px;border-right:1px solid var(--line);text-align:center;">
        <div class="mono" style="color:var(--ochre-400);font-size:26px;font-weight:600;">25,12</div>
        <div style="color:var(--ivory-dim);font-size:13px;margin-top:4px;">Nejlepší čas (s)</div>
      </div>
      <div style="padding:26px 24px;text-align:center;">
        <div class="mono" style="color:var(--ochre-400);font-size:26px;font-weight:600;">2006</div>
        <div style="color:var(--ivory-dim);font-size:13px;margin-top:4px;">První záznamy</div>
      </div>
    </div>
  </section>

  <!-- Filters + results -->
  <section style="width:100%;background:var(--ivory);">
    <div style="max-width:1280px;margin:0 auto;padding:64px 32px 96px;display:flex;flex-direction:column;gap:32px;">

      <div id="year-filters" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span class="mono" style="font-size:12px;color:#5A5140;letter-spacing:0.1em;">ROK:</span>
      </div>

      <div id="results-list" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
  </section>

  <!-- Footer (shared) -->
  <footer style="width:100%;background:var(--navy-900);margin-top:auto;">
    <div style="max-width:1280px;margin:0 auto;padding:40px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
      <div class="mono" style="color:var(--ivory-dim);font-size:12px;">SDH BOR U SEDLČAN © 1906–2026</div>
      <a href="index.html" style="color:var(--ivory-dim);font-size:13px;border-bottom:2px solid var(--ochre-500);padding-bottom:2px;">Zpět na úvod</a>
    </div>
  </footer>

</div>

<script>
  var allResults = [
    { year: '2019', yearLabel: '2019', isWin: true, title: 'Závod Mezi Stromy', desc: 'Kategorie: Starší žáci — na šestém ročníku dětské soutěže v požárním útoku v obecním parku (rekordních 15 družstev) zvítězil tým SDH Bor; v kategorii mladších žáků skončil druhý za ČHJ Nalžovice.', time: null, video: 'https://youtu.be/f-YlCLLP4tE?si=g7qupxKQQU_LJQAl', detail: 'mezi-stromy-2019.html' },
      { year: '2019', yearLabel: '2019', isWin: false, title: 'Noční soutěž Dobrošovka Cup', desc: 'Noční hasičská soutěž v Dobrošovicích, 8. 6. 2019.', time: null, detail: 'dobrosovka-cup-2019.html' },
      { year: '2019', yearLabel: '2019', isWin: false, title: 'OHS Martinice', desc: 'Okrsková soutěž 25. 5. 2019, dvanáct družstev ve dvoukolovém požárním útoku. SDH Bor obsadil 2. místo v kategorii žen i dětí.', time: null, detail: 'ohs-martinice-2019.html' },
      { year: '2018', yearLabel: '2018', isWin: false, title: 'Martinická osma', desc: '4. ročník soutěže v požárním útoku v Zadních Boudách, 22. 9. 2018. Mládež: 2. místo SDH Bor A a 3. místo SDH Bor B; ženy PS 12: 3. místo SDH Bor.', time: null, detail: 'martinicka-osma-2018.html' },
      { year: '2018', yearLabel: '2018', isWin: true, title: 'Mezi stromy', desc: 'Kategorie: Mladší žáci — na pátém ročníku dětské soutěže v požárním útoku v Jesenici (15. 9. 2018) zvítězilo družstvo SDH Bor u Sedlčan.', time: null, detail: 'mezi-stromy-2018.html' },
      { year: '2018', yearLabel: '2018', isWin: true, title: 'OHS Nedrahovice', desc: 'Okrsková soutěž 16. 6. 2018, jedenáct družstev. SDH Bor zvítězil v kategorii žen i dětí.', time: null, detail: 'ohs-nedrahovice-2018.html' },
      { year: '2017', yearLabel: '2017', isWin: false, title: 'Martinická osma', desc: '3. ročník soutěže v Zadních Boudách (23. 9. 2017), 27 družstev. SDH Bor v kategorii PS 12: ženy 2. místo, děti 3. místo, muži 4. místo.', time: null, detail: 'martinicka-osma-2017.html' },
      { year: '2017', yearLabel: '2017', isWin: true, title: '111 let SDH Bor', desc: 'Soutěž k 111. výročí sboru (19. 8. 2017). Muži SDH Bor zvítězili, ženy a děti (Bor A) skončily druhé.', time: '47,42 s', detail: '111-let-sdh-bor-2017.html' },
      { year: '2017', yearLabel: '2017', isWin: false, title: 'Noční soutěž Dobrošovka Cup', desc: 'Noční hasičská soutěž v Dobrošovicích, 3. 6. 2017.', time: null, detail: 'dobrosovka-cup-2017.html' },
      { year: '2017', yearLabel: '2017', isWin: true, title: 'OHS Dobrošovice', desc: 'Okrsková soutěž 6. 5. 2017. Ženy SDH Bor zvítězily, muži skončili sedmí, dětská družstva Bor A a Bor AA čtvrtá a páté.', time: '28,68 s', detail: 'ohs-dobrosovice-2017.html' },
      { year: '2016', yearLabel: '2016', isWin: false, title: 'OHS Mezné', desc: 'Okrsková hasičská soutěž v Mezném, 4. 6. 2016.', time: null, detail: 'ohs-mezne-2016.html' },
      { year: '2015', yearLabel: '2015', isWin: false, title: 'OHS Jesenice', desc: 'Okrsková soutěž 9. 5. 2015. SDH Bor skončil pátý v kategorii mužů i mužů nad 35 let.', time: null, detail: 'ohs-jesenice-2015.html' },
      { year: '2014', yearLabel: '2014', isWin: false, title: 'OHS Bor', desc: 'Okrsková soutěž v Boru 28. 6. 2014. Muži nad 35 let SDH Bor skončili třetí, muži sedmí.', time: null, detail: 'ohs-bor-2014.html' },
      { year: '2013', yearLabel: '2013', isWin: false, title: 'OHS Kamenice', desc: 'Okrsková soutěž 8. 6. 2013. Muži SDH Bor skončili devátí.', time: null, detail: 'ohs-kamenice-2013.html' },
      { year: '2011', yearLabel: '2011', isWin: false, title: 'OHS Nedrahovice', desc: 'Okrsková soutěž 4. 6. 2011. Družstva mužů SDH Bor II a Bor I skončila pátá a sedmá.', time: null, detail: 'ohs-nedrahovice-2011.html' },
      { year: '2009', yearLabel: '2009', isWin: false, title: 'OHS Jesenice', desc: 'Okrsková soutěž 13. 6. 2009, požární útok a štafeta. Muži SDH Bor obsadili 2. místo.', time: '118,84 s', detail: 'ohs-jesenice-2009.html' },
      { year: '2007', yearLabel: '2007', isWin: true, title: 'OHS Bor', desc: 'Domácí okrsková soutěž 9. 6. 2007. Muži SDH Bor zvítězili.', time: '25,12 s', detail: 'ohs-bor-2007.html' },
  ];

  var yearOptions = ['Vše', '2019', '2018', '2017', '2016', '2015', '2014', '2013', '2011', '2009', '2007'];
  var selectedYear = 'Vše';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var filterWrap = document.getElementById('year-filters');
    filterWrap.innerHTML = '<span class="mono" style="font-size:12px;color:#5A5140;letter-spacing:0.1em;">ROK:</span>';
    yearOptions.forEach(function (y) {
      var btn = document.createElement('button');
      btn.className = 'chip' + (y === selectedYear ? ' active' : '');
      btn.textContent = y;
      btn.addEventListener('click', function () {
        selectedYear = y;
        render();
      });
      filterWrap.appendChild(btn);
    });

    var filtered = selectedYear === 'Vše' ? allResults : allResults.filter(function (r) { return r.year === selectedYear; });
    var list = document.getElementById('results-list');
    list.innerHTML = '';

    if (filtered.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'mono';
      empty.style.cssText = 'color:#7A6E58;font-size:13px;padding:24px 0;';
      empty.textContent = 'Pro zvolený rok nejsou žádné záznamy.';
      list.appendChild(empty);
      return;
    }

    filtered.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'card result-row';
      var yearColor = r.isWin ? 'var(--ochre-500)' : 'var(--navy-900)';
      row.innerHTML =
        '<div class="badge-win">' +
          (r.isWin ? '<span class="win-tag">1. místo</span>' : '') +
        '</div>' +
        '<span class="mono year-col" style="color:' + yearColor + ';font-size:14px;">' + escapeHtml(r.yearLabel) + '</span>' +
        '<div class="result-content">' +
          '<span style="font-weight:600;font-size:15px;">' + escapeHtml(r.title) + '</span>' +
          '<span style="font-size:13px;color:#7A6E58;">' + escapeHtml(r.desc) + '</span>' +
          ((r.detail || r.video) ? '<div style="display:flex;gap:14px;margin-top:2px;">' +
            (r.detail ? '<a href="' + r.detail + '" class="mono" style="color:var(--navy-900);font-size:12px;font-weight:600;border-bottom:1px solid var(--navy-900);">Detail \u2192</a>' : '') +
            (r.video ? '<a href="' + r.video + '" target="_blank" rel="noopener" class="mono" style="color:var(--ochre-500);font-size:12px;font-weight:600;">\u25B6 Video</a>' : '') +
          '</div>' : '') +
        '</div>' +
        (r.time ? '<span class="mono time-col" style="color:var(--navy-900);font-size:14px;">' + escapeHtml(r.time) + '</span>' : '');
      list.appendChild(row);
    });
  }

  render();
</script>
</body>
</html>
